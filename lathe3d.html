<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>3D Lathe Generator</title>
<style>
  :root{--bg:#0b0f17;--panel:#111827;--panel2:#0f172a;--line:#263244;--text:#e5e7eb;--muted:#94a3b8;--accent:#38bdf8;--warn:#fb7185}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(135deg,#070b12,#111827);color:var(--text);font-family:Inter,system-ui,Segoe UI,sans-serif;overflow:hidden}
  .app{display:grid;grid-template-columns:1fr 1fr;height:100vh;gap:12px;padding:12px}
  .panel{background:rgba(17,24,39,.88);border:1px solid #263244;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px #0008}
  .head{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #263244}
  .headRight{display:flex;align-items:center;gap:8px}
  .title{font-weight:800;letter-spacing:.2px}
  .headActions{display:flex;align-items:center;gap:8px}
  .headActions button{padding:7px 11px;border-radius:10px;font-size:12px}
  .headActions label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .headActions input[type=number]{width:72px;padding:6px 8px;border-radius:8px;border:1px solid #334155;background:#182235;color:var(--text);font-weight:700}
  .badge{font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;background:#0b1220;color:#7dd3fc;border:1px solid #1e3a5f}
  .badge.view{color:#bbf7d0;border-color:#166534}
  .canvasWrap,.viewWrap{position:relative;flex:1;min-height:0}
  canvas{display:block;width:100%;height:100%}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-top:1px solid #263244;background:rgba(15,23,42,.9)}
  button{border:1px solid #334155;background:#182235;color:var(--text);padding:9px 13px;border-radius:12px;font-weight:700;cursor:pointer}
  button:hover{border-color:#38bdf8;background:#1e293b}
  button.warn{animation:shake .18s linear 2;border-color:var(--warn);color:#fecdd3}
  @keyframes shake{50%{transform:translateX(3px)}}
  .stat{color:var(--muted);font-size:13px;margin-right:auto}
  label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .toolbar input[type=number]{width:68px;padding:6px 8px;border-radius:8px;border:1px solid #334155;background:#182235;color:var(--text);font-weight:700}
  input[type=range]{width:120px;accent-color:var(--accent)}
  .hint{position:absolute;left:14px;bottom:14px;color:#94a3b8;font-size:12px;background:#02061799;border:1px solid #243044;border-radius:12px;padding:8px 10px;pointer-events:none}
  @media (max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.head{height:48px}.toolbar{padding:9px}}
</style>
</head>
<body>
<div class="app">
  <section class="panel">
    <div class="head">
      <div class="title">2D 단면 드로잉</div>
      <div class="headRight">
        <button id="zoomOutBtn" type="button" aria-label="2D Zoom Out">-</button>
        <button id="zoomInBtn" type="button" aria-label="2D Zoom In">+</button>
        <div id="modeBadge" class="badge">DRAW MODE</div>
        <div id="axisDistInfo" class="badge">축거리: -</div>
      </div>
    </div>
    <div class="canvasWrap"><canvas id="drawCanvas"></canvas></div>
    <div class="toolbar">
      <span id="ptCount" class="stat">0 pts</span>
      <button id="undoBtn">Undo</button>
      <button id="clearBtn">🛇 Clear</button>
      <button id="importBtn">Open JSON File</button>
      <button id="pasteBtn">Paste JSON</button>
      <button id="rotateCcwBtn">Rotate CCW</button>
      <button id="rotateCwBtn">Rotate CW</button>
      <label>Rotate° <input id="rotateStepInput" type="number" min="0.1" max="180" step="0.1" value="8"></label>
      <label>Move px <input id="moveStepInput" type="number" min="1" max="200" step="1" value="4"></label>
      <button id="createBtn">Create 3D</button>
      <input id="importInput" type="file" accept="application/json,.json" hidden>
      <label>Segments▶ <input id="segSlider" type="range" min="6" max="128" value="32"><span id="segVal">32</span></label>
      <label>Wire▶ <input id="wireSlider" type="range" min="0" max="100" value="28"><span id="wireVal">28%</span></label>
    </div>
  </section>

  <section class="panel">
    <div class="head">
      <div class="title">3D 미리보기</div>
      <div class="headActions">
        <label>Scale <input id="exportScaleInput" type="number" min="0.001" max="100" step="0.1" value="1.0"></label>
        <button id="exportBtn">EXPORT</button>
        <button id="exportX90Btn">EXPORT X_90</button>
      </div>
    </div>
    <div class="viewWrap">
      <canvas id="threeCanvas"></canvas>
      <div class="hint">좌클릭 드래그 회전 · 우클릭 드래그 팬 · 휠/핀치 줌</div>
    </div>
  </section>
</div>

<script type="module" src="./lathe3d.js"></script>
</body>
</html>
